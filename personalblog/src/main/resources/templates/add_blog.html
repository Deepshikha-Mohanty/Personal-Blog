<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Blog</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9D%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- Navbar -->
<div class="navbar">
    <a th:href="@{/home}" class="brand">
        <span class="brand-mark">📝</span>
        My Blog
    </a>
    <div class="nav-actions">
        <button type="button" class="icon-btn" data-theme-toggle aria-label="Toggle theme"></button>
        <a th:href="@{/home}" class="btn btn-ghost">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Back
        </a>
    </div>
</div>

<div class="form-page-header page-fade">
    <div class="container" style="padding: 0;">
        <div class="eyebrow">Compose</div>
        <h2>Write a New Blog Post</h2>
    </div>
</div>

<div class="container">
    <div class="form-card surface page-fade">

        <form th:action="@{/blogs}" method="post">

            <div class="field">
                <label for="title">Title</label>
                <input
                        class="input"
                        type="text"
                        id="title"
                        name="title"
                        placeholder="Give your post a great title"
                        maxlength="150"
                        required>
                <div class="char-counter" data-counter-for="title" data-max="150">0 / 150</div>
            </div>

            <div class="field">
                <label for="content">Content</label>
                <textarea
                        class="input"
                        id="content"
                        name="content"
                        placeholder="Write your blog here..."
                        required></textarea>
                <div class="char-counter" data-counter-for="content">0 characters</div>
            </div>

            <div class="field">
                <label for="genre">Genre</label>
                <select class="input" id="genre" name="genre" required>
                    <option value="">-- Select Genre --</option>
                    <option value="Technology">Technology</option>
                    <option value="Programming">Programming</option>
                    <option value="Travel">Travel</option>
                    <option value="Education">Education</option>
                    <option value="Food">Food</option>
                    <option value="Lifestyle">Lifestyle</option>
                    <option value="Sports">Sports</option>
                    <option value="Health">Health</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <!-- createdAt is automatically set in the model -->
            <!-- blog_id is auto-generated -->

            <button type="submit" class="btn btn-primary btn-block">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                Publish Blog
            </button>

        </form>

        <a th:href="@{/home}" class="back-link" style="justify-content:center; display:flex;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Back to Home
        </a>

    </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
