<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${blog.title}">Blog Details</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9D%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="progress-bar"></div>

<!-- Navbar -->
<div class="navbar">
    <a th:href="@{/home}" class="brand">
        <span class="brand-mark">📝</span>
        My Blog
    </a>
    <div class="nav-actions">
        <button type="button" class="icon-btn" data-theme-toggle aria-label="Toggle theme"></button>
        <a th:href="@{/home}" class="btn btn-ghost">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Back
        </a>
    </div>
</div>

<div class="container page-fade">
    <article class="article-shell surface">

        <div class="article-eyebrow">Post #<span th:text="${blog.blog_id}">1</span></div>

        <h1 class="article-title" th:text="${blog.title}">Title</h1>

        <div class="article-meta">
            <span class="genre-tag" th:text="${blog.genre}" th:attr="data-genre=${blog.genre}">Genre</span>
            <span class="meta-date">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                <span th:text="${#temporals.format(blog.createdAt, 'dd MMM yyyy, HH:mm')}">Date</span>
            </span>
        </div>

        <div class="article-body" th:text="${blog.content}">
            Full blog content here...
        </div>

        <div class="article-actions">
            <a th:href="@{/home}" class="btn btn-ghost">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                Back to Home
            </a>
            <a th:href="@{'/edit-blog/' + ${blog.blog_id}}" class="btn btn-success">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                Edit
            </a>
            <form th:action="@{'/delete-blog/' + ${blog.blog_id}}"
                  method="post"
                  data-confirm="Delete this blog post? This cannot be undone.">
                <button type="submit" class="btn btn-danger">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
                    Delete
                </button>
            </form>
        </div>

    </article>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
