<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Blog</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9D%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- Navbar -->
<div class="navbar">
    <a th:href="@{/home}" class="brand">
        <span class="brand-mark">📝</span>
        My Blog
    </a>
    <div class="nav-actions">
        <button type="button" class="icon-btn" data-theme-toggle aria-label="Toggle theme"></button>
        <a th:href="@{/home}" class="btn btn-ghost">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Back
        </a>
    </div>
</div>

<div class="form-page-header page-fade" style="background: linear-gradient(135deg, var(--success), #00967a 70%);">
    <div class="container" style="padding: 0;">
        <div class="eyebrow">Editing</div>
        <h2 th:text="${blog.title}">Edit Blog</h2>
    </div>
</div>

<div class="container">
    <div class="form-card surface page-fade">

        <form th:action="@{/update-blog}" method="post">

            <!-- Hidden ID -->
            <input type="hidden" name="blog_id" th:value="${blog.blog_id}">

            <div class="field">
                <label for="title">Title</label>
                <input class="input" type="text" id="title" name="title" th:value="${blog.title}" maxlength="150" required>
                <div class="char-counter" data-counter-for="title" data-max="150">0 / 150</div>
            </div>

            <div class="field">
                <label for="content">Content</label>
                <textarea class="input" id="content" name="content" th:text="${blog.content}" required></textarea>
                <div class="char-counter" data-counter-for="content">0 characters</div>
            </div>

            <div class="field">
                <label for="genre">Genre</label>
                <select class="input" id="genre" name="genre" required>
                    <option value="" th:selected="${blog.genre == null or blog.genre == ''}">-- Select Genre --</option>
                    <option value="Technology" th:selected="${blog.genre == 'Technology'}">Technology</option>
                    <option value="Programming" th:selected="${blog.genre == 'Programming'}">Programming</option>
                    <option value="Travel" th:selected="${blog.genre == 'Travel'}">Travel</option>
                    <option value="Education" th:selected="${blog.genre == 'Education'}">Education</option>
                    <option value="Food" th:selected="${blog.genre == 'Food'}">Food</option>
                    <option value="Lifestyle" th:selected="${blog.genre == 'Lifestyle'}">Lifestyle</option>
                    <option value="Sports" th:selected="${blog.genre == 'Sports'}">Sports</option>
                    <option value="Health" th:selected="${blog.genre == 'Health'}">Health</option>
                    <option value="Other" th:selected="${blog.genre == 'Other'}">Other</option>
                </select>
            </div>

            <button type="submit" class="btn btn-success btn-block">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                Update Blog
            </button>

        </form>

        <a th:href="@{/home}" class="back-link" style="justify-content:center; display:flex;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Back to Home
        </a>

    </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
